<div class="register-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">

        <div class="card shadow-lg border-0 p-4 register-card">

          <div class="text-center mb-3">
            <h2 class="fw-bold m-0 brand-title">PrimeMart</h2>
            <p class="text-muted small m-0">Create your account</p>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input class="form-control form-control-lg"
                   [(ngModel)]="name"
                   placeholder="Enter your name">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input class="form-control form-control-lg"
                   [(ngModel)]="email"
                   type="email"
                   placeholder="Enter your email">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input class="form-control form-control-lg"
                   [(ngModel)]="username"
                   placeholder="Choose username">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input class="form-control form-control-lg"
                   [(ngModel)]="password"
                   type="password"
                   placeholder="Create password">
          </div>

          <button class="btn btn-warning btn-lg w-100 fw-bold"
                  [disabled]="loading"
                  (click)="register()">
            {{ loading ? 'Creating Account...' : 'Register' }}
          </button>

          <div class="text-center mt-3">
            <span class="text-muted">Already have an account?</span>
            <a routerLink="/login" class="ms-1 fw-semibold link-primary">
              Login
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
