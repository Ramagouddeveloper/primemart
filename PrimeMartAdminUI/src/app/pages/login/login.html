<div class="login-wrapper">
  <div class="login-card">

    <h2 class="login-title">PrimeMart Admin Login</h2>
    <p class="login-subtitle">Sign in with your admin account</p>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password">
    </div>

    <button class="login-btn" (click)="login()">
      Login
    </button>

  </div>
</div>
